<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Borrower Profile - LendManager</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body>

    <div class="layout">
      <aside class="sidebar">
        <div style="font-weight:800; font-size:18px; margin:8px 0 16px">💰 LendManager</div>
        <div class="grid">
          <a class="btn ghost" href="dashboard.html">📊 Dashboard</a>
          <a class="btn primary" href="borrowers.html">👥 Borrowers</a>
          <a class="btn ghost" href="loans.html">📄 Loans</a>
          <a class="btn ghost" href="due-payments.html">⏰ Due Payments</a>
          <a class="btn ghost" href="payments.html">💵 Payments</a>
          <a class="btn ghost" href="reports.html">📈 Reports</a>
          <a class="btn ghost" href="settings.html">⚙️ Settings</a>
          <button class="btn ghost" onclick="logout()">🚪 Logout</button>
        </div>
        <div class="footer-credit">System by Edwin Macatangay Perez</div>
      </aside>
      <div class="main">
        <div class="topbar">
          <div style="font-weight:700">Borrower Profile</div>
          <div id="userEmail" style="font-size:12px; color:var(--muted)"></div>
        </div>
        <div class="container">
<div id="borrowerInfo" class="card"></div>
<div class="grid grid-2" style="margin-top:12px"><div class="card"><h4>Active Loans</h4><div id="activeLoans"></div></div><div class="card"><h4>Payment History</h4><div id="payHistory"></div></div></div>
<script>
async function loadBorrowerView(){
  const sess=await requireAuth(); if(!sess) return;
  document.getElementById('userEmail').textContent=sess.user.email;
  const id=new URLSearchParams(location.search).get('id');
  const supa=getSupabase();
  const {data:b}=await supa.from('borrowers').select('*').eq('id', id).single();
  document.getElementById('borrowerInfo').innerHTML=`<h3>${b.full_name}</h3><div style="color:var(--muted)">${b.mobile_number} • ${b.address||''}</div><div style="margin-top:8px">Email: ${b.email||'-'}<br>Notes: ${b.notes||'-'}</div>`;
  const {data:loans}=await supa.from('loans').select('*').eq('borrower_id', id).eq('user_id', sess.user.id);
  const totalBorrowed=loans.reduce((s,l)=>s+Number(l.principal),0);
  const totalPaid=loans.reduce((s,l)=>s+Number(l.total_payable)-Number(l.remaining_balance),0);
  const remaining=loans.reduce((s,l)=>s+Number(l.remaining_balance),0);
  document.getElementById('activeLoans').innerHTML=`Total Borrowed: <b>${peso(totalBorrowed)}</b><br>Total Paid: <b>${peso(totalPaid)}</b><br>Remaining: <b>${peso(remaining)}</b><hr>`+loans.map(l=>`<div style="margin:6px 0">${peso(l.principal)} - ${l.status} - Remaining ${peso(l.remaining_balance)}</div>`).join('');
  const {data:payments}=await supa.from('payments').select('*, payment_schedules(payment_number)').eq('user_id', sess.user.id).in('loan_id', loans.map(l=>l.id));
  document.getElementById('payHistory').innerHTML=(payments||[]).map(p=>`<div style="font-size:13px; margin:6px 0">${fmtDate(p.payment_date)} - ${peso(p.amount_paid)} - #${p.payment_schedules?.payment_number||''} - ${p.payment_method}</div>`).join('')||'<div class="empty">No payments</div>';
}
document.addEventListener('DOMContentLoaded', loadBorrowerView);
</script>
</div>
        <div class="footer-credit">System by Edwin Macatangay Perez</div>
      </div>
    </div>
    <nav class="bottom-nav">
      <div class="nav-grid">
        <a href="dashboard.html">📊<span>Dash</span></a>
        <a href="borrowers.html">👥<span>Borrow</span></a>
        <a href="loans.html">📄<span>Loans</span></a>
        <a href="due-payments.html">⏰<span>Due</span></a>
        <a href="settings.html">⚙️<span>Set</span></a>
      </div>
    </nav>
    
<div id="toast" class="toast"></div>
<div id="modal" class="modal-backdrop"><div class="modal" id="modalBox"></div></div>

<script src="js/auth.js"></script>
</body></html>
