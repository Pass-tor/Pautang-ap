<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register - LendManager</title><link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body>
<div class="container auth-wrap"><div class="card">
<h2>Create account</h2>
<form onsubmit="handleRegister(event)" class="grid">
<div><label class="label">Lender Name</label><input id="lender_name" class="input" required></div>
<div><label class="label">Email</label><input id="email" class="input" type="email" required></div>
<div><label class="label">Password</label><input id="password" class="input" type="password" minlength="6" required></div>
<button class="btn primary" type="submit">Register</button>
</form>
<div style="margin-top:10px"><a class="link" href="login.html">Already have account? Login</a></div>
</div><div class="footer-credit">System by Edwin Macatangay Perez</div></div>
<div id="toast" class="toast"></div>
<script src="js/supabase.js"></script><script src="js/auth.js"></script>
</body></html>
