<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loans - LendManager</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body>

    <div class="layout">
      <aside class="sidebar">
        <div style="font-weight:800; font-size:18px; margin:8px 0 16px">💰 LendManager</div>
        <div class="grid">
          <a class="btn ghost" href="dashboard.html">📊 Dashboard</a>
          <a class="btn ghost" href="borrowers.html">👥 Borrowers</a>
          <a class="btn primary" href="loans.html">📄 Loans</a>
          <a class="btn ghost" href="due-payments.html">⏰ Due Payments</a>
          <a class="btn ghost" href="payments.html">💵 Payments</a>
          <a class="btn ghost" href="reports.html">📈 Reports</a>
          <a class="btn ghost" href="settings.html">⚙️ Settings</a>
          <button class="btn ghost" onclick="logout()">🚪 Logout</button>
        </div>
        <div class="footer-credit">System by Edwin Macatangay Perez</div>
      </aside>
      <div class="main">
        <div class="topbar">
          <div style="font-weight:700">Loans</div>
          <div id="userEmail" style="font-size:12px; color:var(--muted)"></div>
        </div>
        <div class="container">
<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px"><input id="search" class="input" placeholder="Search borrower or ID" oninput="loadLoans()" style="max-width:220px"><select id="statusFilter" class="select" style="max-width:160px" onchange="loadLoans()"><option value="">All Status</option><option>Active</option><option>Completed</option><option>Overdue</option><option>Pending</option><option>Cancelled</option></select><button class="btn primary" onclick="openLoanModal()">+ Add Loan</button></div>
<div class="card table-wrap"><table><thead><tr><th>ID</th><th>Borrower</th><th>Principal</th><th>Total</th><th>Paid</th><th>Remaining</th><th>Status</th><th>Start</th><th>Actions</th></tr></thead><tbody id="loansBody"></tbody></table></div>
<script src="js/loans.js"></script>
</div>
        <div class="footer-credit">System by Edwin Macatangay Perez</div>
      </div>
    </div>
    <nav class="bottom-nav">
      <div class="nav-grid">
        <a href="dashboard.html">📊<span>Dash</span></a>
        <a href="borrowers.html">👥<span>Borrow</span></a>
        <a href="loans.html">📄<span>Loans</span></a>
        <a href="due-payments.html">⏰<span>Due</span></a>
        <a href="settings.html">⚙️<span>Set</span></a>
      </div>
    </nav>
    
<div id="toast" class="toast"></div>
<div id="modal" class="modal-backdrop"><div class="modal" id="modalBox"></div></div>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
